name: Deploy Backend (Cloudflare Workers)

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Deploy dev to Cloudflare Workers
        if: github.ref_name == 'develop'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/backend
          command: deploy --env dev

      - name: Run dev DB migrations
        if: github.ref_name == 'develop'
        env:
          INIT_DB_SECRET: ${{ secrets.INIT_DB_SECRET }}
        run: npm run migrate:dev

      - name: Deploy production to Cloudflare Workers
        if: github.ref_name == 'main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/backend
          command: deploy --env production

      - name: Run production DB migrations
        if: github.ref_name == 'main'
        env:
          INIT_DB_SECRET: ${{ secrets.INIT_DB_SECRET }}
        run: npm run migrate:prod
