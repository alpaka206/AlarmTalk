name: Android Build

# PR 에서는 `ci` 라벨을 붙였을 때만 돈다(ci.yml 과 같은 규칙 — 이유는 그쪽 주석 참고).
# 작업 브랜치 푸시(feat/**·fix/** …) 트리거도 뺐다. PR 을 열기 전 단계에서 커밋마다 도는 게
# 낭비였고, 필요하면 Actions 탭의 Run workflow 로 언제든 브랜치를 골라 돌릴 수 있다.
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches: [develop, main]
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: AlarmTalk (Android devDebug)
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android-native

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble devDebug + run unit tests
        run: ./gradlew :app:assembleDevDebug :app:testDevDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-report
          path: apps/android-native/app/build/reports/tests/testDevDebugUnitTest
          retention-days: 7
          if-no-files-found: warn
