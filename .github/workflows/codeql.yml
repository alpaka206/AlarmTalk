name: "CodeQL"

# PR 에서는 `ci` 라벨을 붙였을 때만 돈다(ci.yml 과 같은 규칙 — 이유는 그쪽 주석 참고).
# 주간 스케줄과 develop·main 푸시 스캔은 그대로 두어, 라벨을 안 붙인 PR 이 있어도 보안 스캔
# 자체가 끊기지는 않는다.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]
    types: [labeled]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci'
    runs-on: ubuntu-latest
    # 해석형 언어 하나라 몇 분이면 끝난다. 360 은 컴파일 언어용 기본값이었다.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 이 저장소는 javascript-typescript 하나뿐이라 **빌드가 필요 없다.**
          # 예전에는 autobuild 스텝이 있었는데 해석형 언어에서는 아무 일도 하지 않는다.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
