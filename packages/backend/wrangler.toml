name = "voice-alarm-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# 커스텀 도메인. alarm-talk.com zone 이 Cloudflare 계정에 등록(추가)된 뒤 `wrangler deploy`
# 시 api.alarm-talk.com 이 이 Worker 에 연결된다. zone 미등록 상태면 배포가 실패하므로,
# 도메인 연결 전까지는 아래 routes 를 주석 처리하고 기본 *.workers.dev 를 사용한다.
routes = [
  { pattern = "api.alarm-talk.com", custom_domain = true }
]

# 계정 변경 시: wrangler 는 로그인된 계정을 사용한다. 특정 계정으로 고정하려면
# account_id = "<your-account-id>" 를 추가한다.

[vars]
ENVIRONMENT = "development"

[[r2_buckets]]
binding = "VOICE_BUCKET"
bucket_name = "voice-alarm-voices"

[triggers]
crons = ["*/5 * * * *"]

# 실제 배포 시 wrangler secret put 으로 설정
# PERSO_API_KEY = ""
# ELEVENLABS_API_KEY = ""
# GEMINI_API_KEY = ""
# GOOGLE_VERTEX_API_KEY = ""
# GOOGLE_VERTEX_CREDENTIALS_JSON = ""
# GOOGLE_VERTEX_LOCATION = "global"
# GOOGLE_VERTEX_MODEL = "gemini-2.5-flash"
# TURSO_DATABASE_URL = ""
# TURSO_AUTH_TOKEN = ""
# FIREBASE_PROJECT_ID = ""
# JWT_SECRET = ""          # 자체 발급 JWT HS256 서명 시크릿 (최소 32자 권장)
# PASSWORD_PEPPER = ""     # bcrypt 해싱 전에 비밀번호에 덧붙일 서버측 페퍼
# GOOGLE_CLIENT_ID = ""    # Google Sign In OAuth audience (web client ID)
# APPLE_CLIENT_ID = "com.voicealarm.nativeapp.ios"  # Apple Sign In bundle ID (run: wrangler secret put APPLE_CLIENT_ID)
# APPLE_SHARED_SECRET = ""  # App Store Connect → 앱 → "앱 전용 공유 비밀(App-Specific Shared Secret)".
#                             미설정 시 POST /api/billing/apple/confirm 은 503. 설정돼도 현재는
#                             fail-closed(501) 이며, 후속 PR 의 App Store Server API/JWS 검증 뒤
#                             entitlement 갱신을 열어야 한다.
# RESEND_API_KEY = ""      # 회원가입 이메일 인증 코드 발송용
# AUTH_EMAIL_FROM = ""     # 예: Voice Alarm <no-reply@your-domain.com>
# AUTH_EMAIL_REPLY_TO = ""
