name = "voice-alarm-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "34cf9e5d676b15021704b5b3d247887c"

# Deploy only with an explicit environment:
#   wrangler deploy --env dev
#   wrangler deploy --env production

# Workers Logs — 나가는 4xx/5xx 한 줄(`at: "api_error"`)과 `logStructured` 의 JSON 을 대시보드에
# **보존**한다. 2026-09-15 전에는 이 블록이 없어 과거 로그가 아예 없었고, 401 거절 같은 4xx 를
# Sentry 에서 내리자(#749) 그 기록이 실시간 `wrangler tail` 에만 남게 됐다.
# ⚠ **환경마다 반복해야 한다** — `observability` 는 [env.*] 에 상속되지 않는다.
# 보존 3일(무료)/7일(유료). 100% 샘플링 — 5분 cron + API 로 하루 수천 건이라 한도(50억)에
# 한참 못 미친다. 로그에는 uid(users.id)만 실리고 이메일·토큰은 없다(`lib/logger.ts`).

[env.dev]
name = "voice-alarm-api-dev"
routes = [
  { pattern = "api-dev.alarm-talk.com", custom_domain = true }
]
vars = { ENVIRONMENT = "development" }

[env.dev.observability]
enabled = true
head_sampling_rate = 1

[[env.dev.r2_buckets]]
binding = "VOICE_BUCKET"
bucket_name = "voice-alarm-voices"

[env.dev.triggers]
# 5분 틱이 본체다. "* * * * *" 는 실행마다 예산(subrequest)을 통째로 받는 전용 크론이다 —
# src/lib/personal-promo.ts 의 PERSONAL_PROMO_END_CRON 과 같은 문자열이어야 한다. 두 일을 나눠 쓴다:
#  - 홀수 분: 탈퇴 등급 통지 대기열(pending_plan_notifications) — 대기 행이 있을 때만 그 분을 통째로 쓴다.
#    비어 있으면 조회 하나만 하고 아래 일에 넘긴다(그래서 끝 시각 전에도 홀수 분마다 조회 하나가 돈다).
#  - 기간 한정 개인 플랜 종료(전환·보관 스윕). 끝부터는 삭제가 다 끝난 뒤에도 분당 존재 확인 조회 하나를
#    돌린다(D15 — 고정 꼬리 없이 끝까지 비운다).
# ⚠ 정리 PR 에서 개인 플랜 종료 분기는 빼도 **이 크론은 지우지 말 것** — 탈퇴 등급 통지를 비우는 곳이
#   여기뿐이다(지우면 유예 파기로 해체된 멤버가 등급 변경·목소리 삭제 예고를 영영 못 받는다).
crons = ["*/5 * * * *", "* * * * *"]

[env.production]
name = "voice-alarm-api"
routes = [
  { pattern = "api.alarm-talk.com", custom_domain = true }
]
vars = { ENVIRONMENT = "production" }

[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.r2_buckets]]
binding = "VOICE_BUCKET"
bucket_name = "voice-alarm-voices-prod"

[env.production.triggers]
# dev 와 같다 — "* * * * *" 는 전용 크론(PERSONAL_PROMO_END_CRON): 탈퇴 등급 통지 대기열(홀수 분) +
# 기간 한정 개인 플랜 종료. 정리 PR 에서도 이 크론은 지우지 말 것(위 dev 주석).
crons = ["*/5 * * * *", "* * * * *"]

# Set real values with `wrangler secret put <KEY> --env <dev|production>`
# or `wrangler secret bulk --env <dev|production>`.
# Required:
# ELEVENLABS_API_KEY
# TURSO_DATABASE_URL
# TURSO_AUTH_TOKEN
# GOOGLE_CLIENT_ID
# JWT_SECRET
# PASSWORD_PEPPER
#
# Optional:
# INIT_DB_SECRET
# GOOGLE_VERTEX_CREDENTIALS_JSON
# GOOGLE_VERTEX_LOCATION
# RESEND_API_KEY
# AUTH_EMAIL_FROM
# AUTH_EMAIL_REPLY_TO
# SENTRY_DSN
#
# Push (FCM HTTP v1) — 미설정 시 푸시는 MOCK 로그만 남김:
# FIREBASE_PROJECT_ID
# FIREBASE_SERVICE_ACCOUNT_JSON   (서비스 계정 JSON 전체, client_email/private_key 포함)
#
# Apple 로그인 (POST /auth/apple) — 미설정 시 500 fail-closed:
# APPLE_BUNDLE_ID                 (iOS 앱 번들 ID — 우리 값은 com.alarmtalk.app)
#                                  네이티브 로그인은 애플 공개키(JWKS) 검증이라 **비밀키가 필요 없다.**
#                                  aud 대조용이라 이 값이 없으면 다른 앱용 토큰도 통과하므로 fail-closed.
#
# Billing — 미설정 provider 는 해당 confirm 라우트가 503:
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (Play Developer API 서비스 계정 JSON)
# ANDROID_PACKAGE_NAME            (com.alarmtalk.app)
# GOOGLE_RTDN_VERIFICATION_TOKEN  (RTDN Pub/Sub push 검증 토큰 — Play Console RTDN 토픽의
#                                  push 구독 URL `/api/billing/google/rtdn?token=<이 값>` 에 박는다)
# APPLE_ISSUER_ID                 (App Store Connect Issuer ID, UUID 형식)
# APPLE_KEY_ID                    (App Store Server API 키의 Key ID)
# APPLE_PRIVATE_KEY               (그 키의 .p8 파일 내용 전체, PEM. 개행 포함)
#                                  ↑ 이 셋 + APPLE_BUNDLE_ID 가 다 있어야 /billing/apple/confirm 이 산다.
#
# 공휴일(KR 보정) — 미설정 시 KR 오버레이 생략, date-holidays 결과만 제공:
# KASI_SERVICE_KEY                (data.go.kr 특일정보 getRestDeInfo, **Decoding(디코딩)** 키.
#                                  Encoding 키를 넣으면 이중 인코딩 → SERVICE_KEY_IS_NOT_REGISTERED_ERROR.
#                                  dev 전용으로만 설정: `wrangler secret put KASI_SERVICE_KEY --env dev`,
#                                  로컬은 .dev.vars.dev 에 추가. prod 에는 넣지 말 것.)
#
# 랜딩 이벤트 메시지 클립 (POST /api/event/:id/clips) — 없으면 그 라우트만 503:
# PERSO_API_KEY                   (pk_live_… — 프로젝트·문장 슬롯은 src/lib/event-voices.ts)
