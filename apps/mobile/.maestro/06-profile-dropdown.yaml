appId: com.devrel.voicealarm
name: "Profile Dropdown & Settings"
---

- launchApp

- tapOn: "🏠"
- assertVisible:
    text: ".*홈.*"
    regex: true
    timeout: 3000

- tapOn:
    id: "profile-avatar"
    optional: true
- tapOn:
    text: ".*프로필.*"
    regex: true
    optional: true

- assertVisible:
    text: ".*설정.*|.*로그아웃.*"
    regex: true
    timeout: 3000
    optional: true

- tapOn:
    text: ".*설정.*"
    regex: true
    optional: true

- assertVisible:
    text: ".*앱 정보.*|.*버전.*"
    regex: true
    timeout: 3000
    optional: true

- back
