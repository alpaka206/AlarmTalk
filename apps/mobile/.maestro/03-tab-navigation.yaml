appId: com.devrel.voicealarm
name: "Tab Navigation"
---

- launchApp

- assertVisible: "🏠"

- tapOn: "🎙️"
- assertVisible:
    text: "음성"
    timeout: 3000

- tapOn: "⏰"
- assertVisible:
    text: "알람"
    timeout: 3000

- tapOn: "💌"
- assertVisible:
    text: "메시지"
    timeout: 3000

- tapOn: "🏠"
- assertVisible:
    text: ".*다음 알람.*|.*알람이 없어요.*"
    regex: true
    timeout: 3000
