appId: com.devrel.voicealarm
name: "Voice Profile Management"
---

- launchApp

- tapOn: "🎙️"
- assertVisible:
    text: "음성"
    timeout: 3000

- assertVisible:
    text: ".*\\d/2.*"
    regex: true

- tapOn:
    text: ".*음성 추가.*|.*추가.*"
    regex: true

- assertVisible:
    text: ".*녹음.*"
    regex: true
- assertVisible:
    text: ".*업로드.*"
    regex: true

- tapOn:
    text: ".*녹음.*"
    regex: true

- assertVisible:
    text: ".*녹음.*"
    regex: true
    timeout: 3000

- back
- assertVisible:
    text: "음성"
    timeout: 3000
