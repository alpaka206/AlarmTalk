appId: com.devrel.voicealarm
name: "Create Alarm"
---

- launchApp

- tapOn: "⏰"
- assertVisible:
    text: "알람"
    timeout: 3000

- tapOn:
    text: ".*추가.*|.*만들기.*"
    regex: true

- assertVisible:
    text: "알람 설정"
    timeout: 3000

- tapOn:
    text: ".*시.*증가.*|hourUp"
    regex: true
    optional: true
- tapOn:
    text: ".*분.*증가.*|minuteUp"
    regex: true
    optional: true

- tapOn:
    text: ".*매일.*"
    regex: true
    optional: true

- scrollUntilVisible:
    element:
      text: ".*저장.*|.*만들기.*"
      regex: true
    direction: DOWN

- tapOn:
    text: ".*저장.*|.*만들기.*"
    regex: true

- assertVisible:
    text: "알람"
    timeout: 5000
