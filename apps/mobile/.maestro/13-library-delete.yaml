appId: com.devrel.voicealarm
name: "Library Browse & Delete"
---

- launchApp

- tapOn: "🏠"
- assertVisible:
    text: ".*홈.*"
    regex: true
    timeout: 3000

- tapOn:
    text: ".*전체 보기.*"
    regex: true
    optional: true

- assertVisible:
    text: ".*보관함.*"
    regex: true
    timeout: 5000
    optional: true

- assertVisible:
    text: ".*전체.*"
    regex: true
    timeout: 3000
    optional: true

- tapOn:
    text: ".*즐겨찾기.*"
    regex: true
    optional: true

- tapOn:
    text: ".*전체.*"
    regex: true
    optional: true

- assertVisible:
    text: ".*아직 받은 메시지가 없어요.*|.*보관함.*"
    regex: true
    timeout: 3000
    optional: true

- swipe:
    direction: LEFT
    from:
      text: ".*\\d{1,2}.*"
      regex: true
    optional: true

- assertVisible:
    text: ".*메시지 삭제.*|.*아직 받은 메시지.*"
    regex: true
    timeout: 3000
    optional: true

- tapOn:
    text: ".*보관함에서만 제거.*"
    regex: true
    optional: true

- tapOn:
    text: ".*취소.*"
    regex: true
    optional: true

- back
