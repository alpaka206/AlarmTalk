appId: com.devrel.voicealarm
name: "Onboarding Flow"
---

- launchApp

- assertVisible: "VoiceAlarm"
- assertVisible:
    text: "소중한 사람의 목소리로.*"
    regex: true

- tapOn: "다음"

- assertVisible: "나만의 목소리 등록"
- tapOn: "다음"

- assertVisible: "매일 아침, 따뜻하게"
- tapOn: "다음"

- assertVisible: "함께 성장하는 나무"
- tapOn: "시작하기"

- assertVisible:
    text: ".*로그인.*"
    regex: true
