// Compose 안정성 설정 — 이 목록의 타입을 **stable 로 취급**한다.
//
// ⚠ 주석은 `//` 다. `#` 을 쓰면 "Error parsing stability configuration file" 로 죽는다.
//
// 왜 필요한가: Compose 는 `List<T>` 같은 인터페이스를 불안정으로 본다. 구현이 가변일 수
// 있어서다(`MutableList` 도 `List` 다). 그래서 리스트를 받는 컴포저블은 부모가 리컴포즈될
// 때마다 **내용이 같아도 함께 리컴포즈**된다. 2026-08-07 측정에서 33개 컴포저블이 그랬고,
// 알람 목록·편집기처럼 큰 화면이 전부 거기 들어 있었다(헤드라인이 1분마다 갱신될 때
// 알람 카드 전체가 다시 그려진다).
//
// ⚠ **거짓말을 적으면 화면이 갱신되지 않는다.** stable 로 선언한 타입을 **제자리에서
// 변형하면** Compose 가 '안 바뀌었다' 고 믿고 건너뛴다. 아래 타입들은 전부
//  - 서버 응답을 파싱해 만든 뒤 읽기만 하거나
//  - 만들 때 한 번 채우고 통째로 교체만 하는 목록이다.
// 새 타입을 추가할 때는 "이 값이 제자리에서 바뀌는 일이 있는가" 를 먼저 확인할 것.
//
// 설정 위치: `app/build.gradle.kts` 의 `composeCompiler.stabilityConfigurationFile`.
// 다시 재려면 그 블록의 metrics/reports 두 줄을 켜고 빌드한 뒤
// `app/build/compose-reports/app_devDebug-composables.txt` 에서 `unstable` 을 센다.

// 코틀린 표준 읽기 전용 컬렉션. 우리 코드는 이것들을 제자리에서 바꾸지 않는다.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// 서버 응답 모델 — 파싱 뒤 읽기만 한다.
com.alarmtalk.app.network.*

// 세션·도메인 값 객체 — 교체만 하고 제자리에서 바꾸지 않는다.
com.alarmtalk.app.data.AuthSession
com.alarmtalk.app.data.AlarmEntity
com.alarmtalk.app.data.HolidayDate
com.alarmtalk.app.data.FamilyAlarmQuietWindow
