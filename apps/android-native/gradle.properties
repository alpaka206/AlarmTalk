org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# compileSdk 36(Android 16)은 AGP 8.7.3 이 "테스트된 상한(35)"을 넘어 경고를 내지만,
# 로컬 SDK Platform 36/build-tools 36 으로 정상 빌드된다. 경고만 무음 처리(빌드 동작 불변).
android.suppressUnsupportedCompileSdk=36

# Backend API targets by Android flavor.
alarmTalkDevApiBaseUrl=https://api-dev.alarm-talk.com/api/
alarmTalkProdApiBaseUrl=https://api.alarm-talk.com/api/

# Google Sign-In OAuth clients. Android uses the Web client for requestIdToken().
alarmTalkDevGoogleWebClientId=677878444839-321tg0ii4og4pa1tk0rpi72erddbvl50.apps.googleusercontent.com
alarmTalkProdGoogleWebClientId=504825419212-uq7dps7fi1duk4jdikciapli3e2l4e30.apps.googleusercontent.com

# Sentry Android DSNs. Leave blank to keep client-side reporting disabled.
alarmTalkDevSentryDsn=
alarmTalkProdSentryDsn=
