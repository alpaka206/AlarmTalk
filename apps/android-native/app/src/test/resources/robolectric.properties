# 유닛 테스트에서는 우리 Application 을 띄우지 않는다.
#
# Robolectric 은 기본으로 매니페스트의 android:name 을 그대로 인스턴스화한다. 그래서 테스트
# 하나마다 AlarmTalkApplication.onCreate() 가 통째로 돌고, 그 첫 줄 initializeSentry() 가 이 맥의
# ~/.gradle/gradle.properties 에 있는 진짜 DSN 으로 SDK 를 켰다. 이어서 androidx.startup 도
# AndroidKeyStore 도 없는 JVM 에서 WorkManager 예약 네 곳과 AuthSessionStore 생성이 던지고,
# onCreate 의 runCatching{}.onFailure{ reportError } 가 그 실패를 전부 이슈로 올렸다 —
# ALARMTALK-ANDROID-2/-3 의 10,256건이 여기서 나왔다(이벤트 태그 os.build=robolectric).
#
# 어떤 테스트도 이 Application 에 의존하지 않는다(src/test·src/androidTest 에서 AlarmTalkApplication
# 참조 0건). 그래서 맨 Application 으로 갈아 끼운다 — 프로덕션 코드는 건드리지 않는 1차 수정이다.
# 2차는 AlarmTalkApplication.shouldInitializeSentry 다(그쪽 주석에 왜 두 겹인지 적어 두었다).
#
# 회귀 테스트: SentryInitializationGateTest.robolectricRunsThePlainApplication
application=android.app.Application
