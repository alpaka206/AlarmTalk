name: AlarmTalkNative
options:
  bundleIdPrefix: com.alarmtalk.app
  deploymentTarget:
    iOS: "26.0"
  # 소스 문자열은 한국어. SwiftUI `Text("한국어")` 리터럴이 String Catalog 의 키로 쓰이고,
  # ko=키 자체, en/ja 는 Localizable.xcstrings / InfoPlist.xcstrings 가 제공한다.
  # (en·ja 를 knownRegions 에 활성화하려면 Mac 에서 Xcode 로 1회 언어 추가 필요 —
  #  docs/qa/ios-localization.md 참고.)
  developmentLanguage: ko
configurations:
  Debug: debug
  Release: release
# ⚠ **이 리포의 첫 서드파티 의존성이다.** 안드로이드는 `io.sentry:sentry-android-core` 로
# 크래시를 수집하는데 iOS 는 아무것도 없어, 출시하면 아이폰 크래시를 볼 방법이
# App Store Connect 집계뿐이었다(2026-08-11 추가).
# 추가할 때 **오픈소스 고지 목록도 함께 갱신한다** — `Views/Settings/OssLicensesView.swift`.
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # ⚠ **DSN 을 여기 적지 말 것 — 이 리포는 공개다.** 안드로이드가 gradle property
    # (`alarmTalkDevSentryDsn`, 커밋 안 함)로 받는 것과 같은 자리다. 빌드할 때
    # `xcodebuild ... VOICE_ALARM_SENTRY_DSN=https://…` 로 넣거나 gitignore 된
    # xcconfig 에 둔다. **비어 있으면 Sentry 는 그냥 꺼진다**(안드로이드도 같다).
    VOICE_ALARM_SENTRY_DSN: "$(VOICE_ALARM_SENTRY_DSN)"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM must be set per-developer via xcconfig or Xcode UI.
    # Leaving empty here so xcodegen does not hard-bake a team ID into the project.
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      ONLY_ACTIVE_ARCH: YES
      GCC_OPTIMIZATION_LEVEL: "0"
      # 개발 빌드는 dev 백엔드를 본다. 안드로이드의 dev product flavor 와 같은 분리다
      # (build.gradle.kts 의 alarmTalkDevApiBaseUrl). 예전에는 Info.plist 에 prod URL 이
      # 박혀 있어서 **개발 중에 prod 를 때리고 있었다** — prod 에는 베타 테스터 실데이터가 있다.
      VOICE_ALARM_API_BASE_URL: "https://api-dev.alarm-talk.com/api"
      # 안드로이드 dev flavor 의 `VOICE_ALARM_SENTRY_ENVIRONMENT` 와 같은 값.
      VOICE_ALARM_SENTRY_ENVIRONMENT: "development"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: "s"
      ONLY_ACTIVE_ARCH: NO
      VOICE_ALARM_API_BASE_URL: "https://api.alarm-talk.com/api"
      VOICE_ALARM_SENTRY_ENVIRONMENT: "production"
targets:
  AlarmTalk:
    type: application
    platform: iOS
    sources:
      - AlarmTalk
      - Shared
      # Phase 4-D1: StoreKit Configuration 파일을 build resources 에 포함시켜
      # Xcode 의 scheme 에서 시뮬레이터용 IAP 테스트 환경을 선택할 수 있게 한다.
      # 실기기/TestFlight/AppStore 빌드에서는 자동으로 무시됨 (App Store Connect 가 권위).
      - path: AlarmTalk/Configuration/StoreKitConfiguration.storekit
        buildPhase: resources
      # 랜딩 미리듣기 오디오 — 안드로이드 `res/raw/landing_voice_preview.mp3` 와 같은 파일.
      # 이게 없으면 재생 버튼이 소리 없이 진행바만 채운다(예전 iOS 가 그랬다).
      - path: AlarmTalk/Resources
        buildPhase: resources
        excludes:
          - "Licenses"
      # 라이선스 전문은 폴더 구조 없이 번들 루트에 둔다 —
      # `Bundle.main.url(forResource:withExtension:)` 이 그렇게 찾는다.
      - path: AlarmTalk/Resources/Licenses
        buildPhase: resources
        type: group
    dependencies:
      - target: AlarmTalkWidget
        embed: true
      - package: Sentry
        product: Sentry
    # 법무 문서(docs/legal)의 '정책 버전' 을 Swift 상수로 뽑는다. 안드로이드가
    # app/build.gradle.kts:101 에서 하는 것과 같다 — 손으로 관리하면 서버와 어긋나는
    # 순간 동의 기록이 전부 409 로 거부된다. 두 문서 버전이 다르면 빌드를 세운다.
    preBuildScripts:
      - script: "\"$PROJECT_DIR/scripts/generate-legal-version.sh\""
        name: Generate LegalPolicyVersion.swift
        basedOnDependencyAnalysis: false
    settings:
      base:
        INFOPLIST_FILE: AlarmTalk/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alarmtalk.app
        CODE_SIGN_ENTITLEMENTS: AlarmTalk/AlarmTalk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        # GROUP 3: Shared/AlarmIntents.swift 는 앱·위젯 양쪽에 컴파일된다.
        # AlarmAppContext(앱 전용) 부킹 코드는 ALARMTALK_APP 플래그로 앱 타겟에서만 켠다.
        # 위젯 타겟은 이 플래그가 없어 인텐트 *타입* 심볼만 컴파일한다.
        # `$(inherited)` 로 프로젝트 레벨 configs(Debug 의 DEBUG)를 보존한다.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ALARMTALK_APP"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ALARMTALK_APP"
    scheme:
      # ⚠ **UI 테스트 프로세스에는 `xcodebuild FOO=bar` 가 닿지 않는다.** 그건 빌드
      # 설정이고, `TEST_RUNNER_FOO` 는 *앱* 프로세스로 간다. 그래서 실기기 로그인처럼
      # 테스트가 직접 값을 알아야 하는 경우엔 여기 환경변수를 두고, 값은 `$(...)` 로
      # **빌드 설정에서 끌어온다** — 자격증명이 저장소에 남지 않는다.
      #   xcodebuild test ... E2E_EMAIL=... E2E_PASSWORD=...
      environmentVariables:
        E2E_EMAIL: "$(E2E_EMAIL)"
        E2E_PASSWORD: "$(E2E_PASSWORD)"
        # 비밀번호 재설정 E2E — 코드는 서버가 메일로만 보내므로 호출부가 넣어 준다.
        # ⚠ **여기 선언하지 않은 이름은 러너에 전달되지 않는다.** 명령줄에
        # `TEST_RUNNER_FOO=...` 를 줘도 이 목록에 없으면 조용히 비어 온다
        # (2026-08-10 에 그것 때문에 테스트가 계속 skip 됐다).
        E2E_RESET_CODE: "$(E2E_RESET_CODE)"
        E2E_NEW_PASSWORD: "$(E2E_NEW_PASSWORD)"
      # Xcode 가 시뮬레이터에서 본 .storekit 파일을 자동 선택하도록 scheme run action 에 등록.
      # 실기기 빌드/Release 에서는 무시되고 App Store Connect 가 권위로 사용된다.
      storeKitConfiguration: AlarmTalk/Configuration/StoreKitConfiguration.storekit
      # `xcodebuild -scheme AlarmTalk test` 가 단위 테스트를 실행하도록 test action 에 포함.
      testTargets:
        - AlarmTalkTests
        # UI 테스트도 같은 scheme 에 둔다 — 실기기에서 가입·로그인 화면을 실제로
        # 조작해 보는 유일한 경로다(시뮬레이터·실기기 모두 스크립트로는 못 누른다).
        - AlarmTalkUITests
  AlarmTalkWidget:
    type: app-extension
    platform: iOS
    sources:
      - AlarmTalkWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alarmtalk.app.widget
        INFOPLIST_FILE: AlarmTalkWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AlarmTalkWidget/AlarmTalkWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
  AlarmTalkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AlarmTalkUITests
    dependencies:
      - target: AlarmTalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alarmtalk.app.uitests
        TEST_TARGET_NAME: AlarmTalk
        # 실기기에서 돌리려면 테스트 번들도 서명해야 하고, 서명에는 Info.plist 가 필요하다.
        GENERATE_INFOPLIST_FILE: YES
  AlarmTalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AlarmTalkTests
    dependencies:
      - target: AlarmTalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alarmtalk.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AlarmTalk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AlarmTalk"
