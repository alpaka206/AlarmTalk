name: AlarmTalkNative
options:
  bundleIdPrefix: com.voicealarm.nativeapp.ios
  deploymentTarget:
    iOS: "26.0"
  # 소스 문자열은 한국어. SwiftUI `Text("한국어")` 리터럴이 String Catalog 의 키로 쓰이고,
  # ko=키 자체, en/ja 는 Localizable.xcstrings / InfoPlist.xcstrings 가 제공한다.
  # (en·ja 를 knownRegions 에 활성화하려면 Mac 에서 Xcode 로 1회 언어 추가 필요 —
  #  docs/qa/ios-localization.md 참고.)
  developmentLanguage: ko
configurations:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM must be set per-developer via xcconfig or Xcode UI.
    # Leaving empty here so xcodegen does not hard-bake a team ID into the project.
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      ONLY_ACTIVE_ARCH: YES
      GCC_OPTIMIZATION_LEVEL: "0"
      # 개발 빌드는 dev 백엔드를 본다. 안드로이드의 dev product flavor 와 같은 분리다
      # (build.gradle.kts 의 alarmTalkDevApiBaseUrl). 예전에는 Info.plist 에 prod URL 이
      # 박혀 있어서 **개발 중에 prod 를 때리고 있었다** — prod 에는 베타 테스터 실데이터가 있다.
      VOICE_ALARM_API_BASE_URL: "https://api-dev.alarm-talk.com/api"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: "s"
      ONLY_ACTIVE_ARCH: NO
      VOICE_ALARM_API_BASE_URL: "https://api.alarm-talk.com/api"
targets:
  AlarmTalk:
    type: application
    platform: iOS
    sources:
      - AlarmTalk
      - Shared
      # Phase 4-D1: StoreKit Configuration 파일을 build resources 에 포함시켜
      # Xcode 의 scheme 에서 시뮬레이터용 IAP 테스트 환경을 선택할 수 있게 한다.
      # 실기기/TestFlight/AppStore 빌드에서는 자동으로 무시됨 (App Store Connect 가 권위).
      - path: AlarmTalk/Configuration/StoreKitConfiguration.storekit
        buildPhase: resources
      # 랜딩 미리듣기 오디오 — 안드로이드 `res/raw/landing_voice_preview.mp3` 와 같은 파일.
      # 이게 없으면 재생 버튼이 소리 없이 진행바만 채운다(예전 iOS 가 그랬다).
      - path: AlarmTalk/Resources
        buildPhase: resources
    dependencies:
      - target: AlarmTalkWidget
        embed: true
    # 법무 문서(docs/legal)의 '정책 버전' 을 Swift 상수로 뽑는다. 안드로이드가
    # app/build.gradle.kts:101 에서 하는 것과 같다 — 손으로 관리하면 서버와 어긋나는
    # 순간 동의 기록이 전부 409 로 거부된다. 두 문서 버전이 다르면 빌드를 세운다.
    preBuildScripts:
      - script: "\"$PROJECT_DIR/scripts/generate-legal-version.sh\""
        name: Generate LegalPolicyVersion.swift
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicealarm.nativeapp.ios
        INFOPLIST_FILE: AlarmTalk/Info.plist
        CODE_SIGN_ENTITLEMENTS: AlarmTalk/AlarmTalk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        # GROUP 3: Shared/AlarmIntents.swift 는 앱·위젯 양쪽에 컴파일된다.
        # AlarmAppContext(앱 전용) 부킹 코드는 ALARMTALK_APP 플래그로 앱 타겟에서만 켠다.
        # 위젯 타겟은 이 플래그가 없어 인텐트 *타입* 심볼만 컴파일한다.
        # `$(inherited)` 로 프로젝트 레벨 configs(Debug 의 DEBUG)를 보존한다.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ALARMTALK_APP"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ALARMTALK_APP"
    scheme:
      # Xcode 가 시뮬레이터에서 본 .storekit 파일을 자동 선택하도록 scheme run action 에 등록.
      # 실기기 빌드/Release 에서는 무시되고 App Store Connect 가 권위로 사용된다.
      storeKitConfiguration: AlarmTalk/Configuration/StoreKitConfiguration.storekit
      # `xcodebuild -scheme AlarmTalk test` 가 단위 테스트를 실행하도록 test action 에 포함.
      testTargets:
        - AlarmTalkTests
  AlarmTalkWidget:
    type: app-extension
    platform: iOS
    sources:
      - AlarmTalkWidget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicealarm.nativeapp.ios.widget
        INFOPLIST_FILE: AlarmTalkWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AlarmTalkWidget/AlarmTalkWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
  AlarmTalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AlarmTalkTests
    dependencies:
      - target: AlarmTalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicealarm.nativeapp.ios.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AlarmTalk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AlarmTalk"
